      color-scheme: light;
      --background: #f8f3e9;
      --text: #29392e;
      --muted: #69695f;
      --accent: #c79255;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--background);
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(
          ellipse at 50% 12%,
          rgba(255, 255, 255, 0.95),
          transparent 60%
        ),
        var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 900px);
      text-align: center;
      animation: appear 0.7s ease-out both;
    }

    .illustration {
      width: min(100%, 650px);
      height: auto;
      display: block;
      margin: 0 auto;
    }

    h1 {
      margin: 24px 0 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.2rem, 6vw, 3.7rem);
      line-height: 1.1;
      font-weight: 600;
      letter-spacing: -0.04em;
    }

    .divider {
      width: 58px;
      height: 3px;
      margin: 22px auto;
      border-radius: 10px;
      background: var(--accent);
    }

    .message {
      max-width: 580px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      line-height: 1.8;
    }

    footer {
      margin-top: 34px;
      color: #858074;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 18px;
      }

      h1 {
        margin-top: 14px;
      }

      footer {
        margin-top: 26px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
      }
    }
  </style>
</head>
